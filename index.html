<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah Zoghly's Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="welcome">
        <div id="title">
            <p><strong>OS title</strong></p>
        </div>
        <div id="cat-with-eyes">
            <img src = "images/cat-no-eyes.gif" alt = "image" height="250px", width="250px">
            <div id="pupil-left" class="pupil"></div>
            <div id="pupil-right" class="pupil"></div>
        </div>
        <div id="sign">
            <p id="pass-title">Password:</p>
            <input id="pass-field" type="text"> 
            <button id = "enter-os"> Login..</button> 
            <p id="pass-note">You don't really need to type a password; just click the button.</p>
        </div>
    </div>
    <div class="os">
        <div id="bg">
            <img src = "images/bg.jpeg" alt = "bg" height="100%" width="100%">
        </div>  
        <div id="cat">
            <img src ="images/cat.gif" alt = "cat" height="140px", width="140px">
        </div>
    </div>
<script src="main.js"></script>
</body>
</html>
