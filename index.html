<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah Zoghly's Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="welcome">
        <div id="title">
            <p><strong>OS title</strong></p>
        </div>
        <div id="cat-with-eyes">
            <img src = "images/cat-no-eyes.gif" alt = "image" height="250px", width="250px">
            <div id="pupil-left" class="pupil"></div>
            <div id="pupil-right" class="pupil"></div>
        </div>
        <div id="sign">
            <p id="pass-title">Password:</p>
            <input id="pass-field" type="text"> 
            <button id = "enter-os"> Login..</button> 
            <p id="pass-note">You don't really need to type a password; just click the button.</p>
        </div>
    </div>
    <div class="os">
        <div id="wallpaper">
            <div id="bg">
                <img src = "images/bg.jpeg" alt = "bg" height="100%" width="100%">
            </div>  
            <div id="cat">
                <img src ="images/cat.gif" alt = "cat" height="140px", width="140px" id="cat_bg">
            </div>
        </div>
        <div class="bar">
            <div>
                <button id="logout"> <img id="logout-img" src="images/exit.png" alt="logout" height="18vh" width="18vh"></button>
            </div>
            <p id="time">time</p>
        </div>
        <div class="screen">
            <div id="warning">
                <div id="warningheader"></div>
                <div id="warning-content">
                    <p id="warning-text">WARNING</p>
                    <div id="warning-buttons">
                        <button id="warning-bt1" class="button"></button>
                        <button id="warning-bt2" class="button"></button>
                    </div>
                </div>
            </div>
        <div class="apps" id="column1">
            <button id="welcome-app" class="program"><img src="images/info.png" height="50px"></button>
            <button id="catchat" class="program"><img src="images/chat-bubble.png" height="50px"></button>
        </div>
        <div class="app" id="app">
            <div id="appheader">
                <button class="close">X</button>
                <p id="headertext"></p>
            </div>
            <div id="app-content">
            </div>
        </div>
    </div>
<script src="main.js"></script>
</body>
</html>
